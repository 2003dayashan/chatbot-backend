spring.profiles.active=local
spring.application.name=chatbot


# ============================
# SERVER
# ============================
server.port=${PORT:8080}

# ============================
# MONGODB
# ============================
# Local MongoDB (change to MongoDB Atlas URI for production, e.g.:
# spring.data.mongodb.uri=mongodb+srv://<user>:<password>@cluster0.mongodb.net/chatbot_db)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chatbot_db}

# ============================
# JWT
# ============================
# IMPORTANT: replace this with a long random secret in production (min 256 bits for HS256).
# Never commit real secrets to git - use an environment variable instead.
jwt.secret=${JWT_SECRET:ThisIsADevOnlySecretKeyPleaseChangeIt1234567890ABCDEF}
# 24 hours in milliseconds
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ============================
# GOOGLE GEMINI API
# ============================
# Get a free key at https://aistudio.google.com/app/apikey
gemini.api.key=${GEMINI_API_KEY:your-gemini-api-key-here}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
gemini.max.context.messages=10

# ============================
# CORS
# ============================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================
# LOGGING
# ============================

logging.level.com.example.chatbot=DEBUG
logging.level.org.springframework.security=DEBUG
